device: [4, 5, 6, 7]
seed: 42

project_name: 2dgs-utonia
exp_name:  ${p2g.anchor_mode}-bs-${train.batch_size}-n-cd
mode: train


loss:
  w_chamfer: 0 #0.02
  w_depth: 0.5          # depth supervision = 0.5 * mean-depth L1
  w_depth_median: 0.5   #                   + 0.5 * median-depth L1
  w_intensity: 0.2
  w_raydrop: 0.5
  w_scale: 0.02          # softplus max scale>2.5m인 위반 Gaussian만 평균; 0.0이면 비활성화
  enable_lpips: false

metrics:
  interval: 50           # train valid/raydrop + val/test *_valid 진단 metric 계산 주기

train:
  lr: 5e-4
  warmup_iters: 500           # linear warmup over this many optimizer steps
  weight_decay: 1e-4
  grad_clip: 1.0
  max_epochs: 40
  batch_size: 2
  val_check_interval: 1.0
  max_steps: 1000000
  ckpt_path: null   # train from scratch (scheduler + grad clipping stability fix)
  grad_accum_steps: 2
test:
  batch_size: 1
  ckpt_path: null

data:
  dataset_name: "nuscenes"
  dataroot: "/data1/nuScenes"
  version: "v1.0-trainval"
  test_version: "v1.0-test"
  train_split: "train"
  eval_split: "val"
  test_split: "test"
  window_us: 1000000       # 1.0s window: 0.0s ... 1.0s
  sample_gap_us: 100000    # choose every 0.1s from 0.05s sweeps
  gt_middle_count: 3       # loss GT = 2 endpoint inputs + 3 middle sweeps
  pair_mode: "keyframe"    # "sweep" | "keyframe". keyframe: both inputs are
                           # exact-time keyframes pair_kf_stride apart (no box
                           # staleness); GT = 0.1s sweeps between them.
  pair_kf_stride: 2        # keyframe gap for window endpoints (2 ~= 1.0s)
  mode: "bbox"          # "nvs" | "bbox" (Phase A=nvs; Phase B switches to bbox)
  bbox_json_path: "/data1/nuScenes/bbox/tracking_{split}.json"
  num_workers: 4
  eval_num_workers: 0
  verbose: false
  vfov: [-30.67, 10.67] 
  hfov: [-180, 180]  
  image_height: 32
  image_width: 1085
  ring_to_elevation_deg: ${p2g.ring_to_elevation_deg}
  ego_radius: ${p2g.ego_radius}


logger:
  enable: true
  name: wandb
  dir: logs/${exp_name}
  system_metrics: false  # W&B System 탭의 CPU/GPU/RAM 시계열을 기록하지 않음





p2g:
  # Backbone
  freeze_utonia: true
  utonia_ckpt: null   # optional abs path override; null -> checkpoints/utonia/utonia.pth (config dump: config/utonia_pretrained.yaml)
  utonia_feature_stage: 3  # encoder stage index: 3 -> 0.4m/432D, 4 -> 0.8m/576D (default/final)
  anchor_mode: grid        # "spherical" | "grid"
  squery:                       # spherical mode only: raw-point occupied cell = anchor
                                # (temporal fusion은 grid_query 블록으로 양 모드 공유;
                                # 이 head의 K/V는 own-frame token으로 한정)
    count_mode: learned_gumbel  # legacy | learned_gumbel
                                # legacy: unique(anchor, source-token)당 1 Gaussian
                                # learned: (frame, cell, fg/bg label) anchor당 K=[1..4]
    token_stride_m: 0.4       # query seed의 source-token 상대위치를 정규화하는 stage-3 물리 stride
    dtheta_deg: 4.5
    dphi_deg: 3.0
    dlogr: 0.12               # legacy log radial bin; dr_m 설정 시 무시됨
    dr_m: 0.8                 # linear radial bin (m). far 깊이혼합 제거:
                              # spread p95 4.9->0.67m, 예산 1.06x 동일 (2026-07-20 sweep)
    r_min: 2.0
    r_max: 110.0
    max_kv: 64                # anchor당 K/V 토큰 cap (cell 중심 기준 nearest)
    # RoPE metric scale. "adaptive" = anchor별 pi/(실측 support) — 최저밴드
    # (inv_freq[0]=1) 위상이 절대 pi를 넘지 않음. "fixed"는 예전 상수(bg 1.75/
    # fg 1.35). fg 1.35는 instance-wide K/V 지원(max 7.8m)에서 최대 31% aliasing,
    # bg 1.75는 dr_m 전환 후 pi 범위의 47~63%만 사용 (2026-07-21 실측).
    # 두 스위치를 분리해 from-scratch A/B에서 원인 귀속이 가능하게 둠.
    rope_scale_bg: adaptive   # adaptive | fixed
    rope_scale_fg: adaptive   # adaptive | fixed
    attn_chunk: 8192
    n_layers: 2                # bg·fg 공유 cross-attn depth (query refinement 라운드 수)
    cross_attn_backend: flash_varlen # real-batch: 118.5 -> 24.6 ms fwd+bwd
    self_attn_layers: 1         # cross refinement 뒤 anchor별 query set block
    self_attn_backend: flash_varlen  # real-batch: 21.8 -> 13.8 ms fwd+bwd
    grad_balance: sqrt_k
    learned_count:              # learned_gumbel only
      K_max: 4
      tau: 1.0
      # Linear -> anchor-wise max -> LN -> GELU 뒤 같은 frame/label의
      # 3x3x3 spherical local self-attention. 2층이면 유효 receptive field가
      # 5x5x5이고, 3층(7x7x7)은 원거리에서 물리 범위가 지나치게 커 기본 2층.
      local_attn_heads: 8
      local_attn_layers: 2
      local_ffn_ratio: 4
      # statistic = [clip(n_raw/E[N_emitted_rays],0,1), mean raw-point range in
      #              [2.5,110]m -> [0,1], physical-log-normalized LOO Q50,
      #              Q90-Q50, Q50-Q10, valid(0/1)]. E[azimuth rays/cell]=1085/120.
      stat_embedding_dim: 64    # two-layer 6 -> 64 -> 64 MLP
      stat_min_raw: 6
      stat_min_valid_loo: 3     # quantiles must have at least three defined members
      stat_loo_eps: 0.001       # exact LOO Sherman-Morrison denominator gate
      stat_range_min_m: 2.5
      stat_range_max_m: 110.0
      # LOO channel x -> log1p(min(x,cap)/knee) / log1p(cap/knee).
      # 1cm preserves mm-cm resolution; the 0.8m radial-cell width is the cap.
      stat_loo_knee_m: 0.01
      stat_loo_cap_m: 0.8
      ray_azimuth_count: 1085   # emitted panorama rays/revolution, not returned points
      grad_balance_scope: token
      budget:
        enable: true
        target_mean_k: 2.0
        weight: 1.0
        warmup_steps: 500
        ramp_steps: 1000
      logging:
        enable: true
        interval: 20
  grid_query:                   # 공유 temporal fusion(bg_radius_m/bg_max_kv_per_frame/
                                # num_heads/bg_layers/fg_layers는 양 모드 사용) +
                                # grid mode 전용 K routing/head 설정
    count_mode: learned_gumbel  # legacy | learned_gumbel | learned_gumbel_viewpt
    K_max: 3                    # legacy only: occupied 0.4m cell당 최대 Gaussian 수
    points_per_gaussian: 4      # legacy exp=null only: K_i=ceil(raw_count/this), capped by K_max
    exp: 1                      # legacy only: null=raw-count range quantile;
                                # 1=one raw-point medoid; 2=two token-coordinate seeds
    learned_count:              # learned modes only; legacy K_max/points_per_gaussian/exp와 독립
      K_max: 4                  # total K=[1..4]; viewpt는 Common 1 + Additional (K-1)
      tau: 1.0                  # train: hard Gumbel-ST temperature; eval: deterministic argmax
      seed_mode: range_quantile # learned: all quantile; viewpt: medoid Common + quantile Additional
      viewpoint:                # learned_gumbel_viewpt only: gt.pose = T_(0<-t)
        # router 입력 = token 위치를 target sensor frame으로 옮긴 R^T(p_ref - t)의
        # Fourier 인코딩. token마다 값이 달라 pose 하나를 전 token에 동일 concat하던
        # 이전 방식과 다르다. Gaussian parameter는 이 feature를 쓰지 않는다.
        position_frequencies: 8     # 3 * 8 * sin/cos = 48D
        position_scale_m: 110.0     # 최저 band 주기 220m -> 최대 관측거리 110m에서 wrap 없음
                                    # (최고 band 주기 = 220/2^7 = 1.72m)
      # selected K/Additional head 입력 gradient만 1/sqrt(K); router에는 적용하지 않음.
      # learned_count 내부 옵션이므로 count_mode=legacy 전환 시 과거 output 방식 유지.
      grad_balance_scope: token
      budget:
        enable: true
        # DDP 전체 token의 noise-free policy E[K] 평균을 이 값에 맞춤.
        target_mean_k: 2.0
        weight: 1.0
        warmup_steps: 500       # 이 optimizer step 전까지 budget gradient=0
        ramp_steps: 1000        # 이후 weight를 0 -> 1.0으로 선형 증가
      logging:
        enable: true
        interval: 20            # optimizer step 기준 train routing 통계 주기
        # 각 값은 bin lower bound: [0,10), ... [80,110), [110,inf)
        range_edges_m: [0, 10, 20, 30, 40, 60, 80, 110]
    bg_radius_m: 0.8
    bg_max_kv_per_frame: 8
    num_heads: 8
    bg_layers: 2
    fg_layers: 2
    grad_balance: sqrt_k
  head_offset_bound: 0.8    # gaussian pos = seed_pos + bound*tanh(offset), per-axis meters




  # Intensity encoder selection. type=ptv3 -> mini PointTransformerV3 mirroring the
  # frozen Utonia backbone (serialization -> RoPE patch attn + xCPE -> GridPooling);
  # output dim = last channel (no projection head), fused end-to-end with the Utonia
  # stream. type=sparse|mlp fall back to the encoders below. Omitting this block
  # reverts to the legacy intensity_sparse.enable switch.
  intensity_encoder:
    type: ptv3                     # ptv3 | sparse | mlp
    ptv3:
      input_feats: [intensity]     # 1ch intensity/255; [intensity, ray] -> 5D A/B
      channels: [36, 72, 108, 144, 192]   # uses first (utonia_feature_stage + 1); head_dim 18
      num_heads: [2, 4, 6, 8, 8]          # stage4: 192/8=24 (12 would give head_dim 16, RoPE needs %6==0)
      depths: [1, 1, 2, 2, 2]
      patch_size: 1024
      mlp_ratio: 2.0
      order: [z, hilbert]          # or [z, z-trans, hilbert, hilbert-trans] to mirror Utonia

  # Post-fusion joint token refiner over the fused 192D trunk tokens. type=serial
  # preserves serialized RoPE blocks with xCPE; sparse uses exact occupied-cell
  # local attention without xCPE.
  # At stage3 each cell is 0.4m, so window_size=3 attends to at most 3x3x3=27 cells.
  joint_refiner:
    enable: true
    type: sparse                     # serial | sparse
    depth: 2
    num_heads: 8                   # 192/8 = 24 (RoPE head_dim multiple of 6)
    patch_size: 1024                # serial only
    window_size: 3                 # sparse only; odd int or [x, y, z] odd triplet
    attn_chunk_size: 4096          # sparse manual fallback only; CUDA uses flash-attn
    layer_scale: 1.0e-5

  # Fallback (sparse/mlp) intensity config; ignored when intensity_encoder.type=ptv3.
  int_proj:
    in_dim: 5
    out_dim: 64

  # Sparse (SubMConv3d) intensity encoder mirroring the Utonia grid hierarchy, used
  # when intensity_encoder.type=sparse (or the legacy enable switch when the
  # intensity_encoder block is absent). n_down auto-tracks utonia_feature_stage
  # (3 -> 0.4m, 4 -> 0.8m); type=mlp uses per-cell IntensityMLPEncoder.
  intensity_sparse:
    enable: true
    channels: [16, 32, 48, 64, 96]   # uses first (utonia_feature_stage + 1)
    depth: 1                          # SubMConv context blocks per stage

  utonia_adapter:
    bottleneck: null   # residual adapter bottleneck r (PEFT-style); null -> utonia_feature_dim // 4

  agg_mlp:
    hidden_dim: 256
    out_dim: 192       # trunk width; must be a multiple of 24 (8 heads x RoPE/6). head_dim = 192/8 = 24



  gs_params:               # source of truth for the gaussian head size (= sum)
    opacity: 1
    scaling: 2
    rotation: 4
    shs: 32                # 16 intensity SH + 16 raydrop SH
    offset: 3              # position-offset head: 3 enables bounded xyz offset
  # LiDAR geometry. Raster image size comes from data.image_height/width via the
  # Camera object, not from here.
  ring_to_elevation_deg: [
    -30.67, -29.33, -28.00, -26.66, -25.33, -24.00, -22.67, -21.33,
    -20.00, -18.67, -17.33, -16.00, -14.67, -13.33, -12.00, -10.67,
     -9.33,  -8.00,  -6.66,  -5.33,  -4.00,  -2.67,  -1.33,   0.00,
      1.33,   2.67,   4.00,   5.33,   6.67,   8.00,   9.33,  10.67,
  ]
  r_far: 80.0             # RoPE/intensity range normalisation (log1p(r_far))

  # Preprocessing
  ego_radius: 2.5

  # Debug (NaN-collapse tracking — see scripts/nan_collapse_diagnosis.md)
  debug_finite_check: false     # log raw gaussian/render absmax + report first non-finite fwd tensor
  debug_anomaly_batch: -1      # >=0 -> torch.autograd.set_detect_anomaly (slow, raises on first NaN)
  debug_bad_grad_trace: false   # on non-finite grad: list offending params, then SKIP the step
  debug_bad_grad_trace_max: 16

g2g: {}                   # GausTemp takes no config; block kept so cfg.g2g resolves
g2p:
  neg_fov: true
  sh_degree: 3
  debug: false
  scale_factor: 1.0
  dynamic: false
