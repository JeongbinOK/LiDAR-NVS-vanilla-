# Bbox-free Dynamic 2DGS V11.3.
#
# V11 with the adaptive-K router replaced by a fixed count of two Gaussians per
# occupied token. Every other configured value is identical to V11 apart from
# model.variant (and the derived exp_name); correspondence, the temporal stack,
# the offset head and every loss weight are inherited without modification.
#
# Unchanged from V11:
# 1. Position encoding is split across heads. Head 0 is the sole correspondence
#    head and carries no RoPE; its logit is biased by a max-speed soft barrier
#      -a * relu(||dp|| / (v_max * |dt|) - 1)^2,   v_max = 30 m/s, a = 4.
#    The bias is exactly zero inside the radius a 30 m/s object could cover over
#    the endpoint interval, and grows quadratically outside it. Heads 1-11 keep
#    metric 3D RoPE at base=100 and 1.2566 rad/m (2*pi/5 m).
# 2. v_init averages the twelve head-0 attention maps under softmax over twelve
#    plain learned scalars, so the mixture learns which depth resolves
#    correspondence rather than being conditioned on any sample.
# 3. One v_init + v_offset per token is shared by that token's Gaussians. With a
#    fixed count that sharing is a plain index expansion by two.
#
# What changes:
#   The K={1,2,3} Gumbel router is gone, and with it the count predictor, the
#   straight-through opacity gate, the per-K gradient balancing and the
#   K-specific joint heads. The plain fixed-count head owns one parameter
#   block per slot.
#
#   The Gaussian head keeps the rest of what the router's decoder did, so only
#   the count differs. V11 ran
#     LayerNorm(432) -> cat(9 deltas) -> Linear(441,432) -> SiLU
#                    -> k_heads[K]: Linear(432, K*42)
#   and V11.3 runs
#     LayerNorm(432) -> cat(6 deltas) -> Linear(438,432) -> SiLU
#                    -> five attribute Linear(432, width*2)
#   Nine delta channels become six because two slots replace three candidates;
#   the quantity and units are unchanged, seed minus Utonia cell centre in the
#   reference frame, raw metres rather than cell-normalized. The trunk is the
#   only nonlinearity either decoder has, so dropping it would have left this
#   variant a single affine map where V11 has two layers. The head is 226,884
#   parameters against V11's 300,060 decoder, the gap being the three
#   K-specific output heads collapsing to one fixed width.
#
#   Because the count is the same for every token, a mean over Gaussians is
#   exactly a mean over tokens: velocity_l2 and the motion diagnostics stop being
#   silently K-weighted, which is what V11's routed K=1.638 made them.
#
#   The two seeds are the token's own raw points at range ranks
#   floor(N/4) and floor(3N/4), which is the same deterministic rule V11's
#   candidate bank uses for its K=2 row. A token holding a single raw point
#   repeats it, and the per-slot position offsets separate the pair afterwards.
#
#   V11's trained router settled at mean K = 1.638 (58.7% K=1, 18.8% K=2, 22.5%
#   K=3) and 91.6k Gaussians per step at batch_size=2, so a fixed two is about
#   22% more Gaussians. Peak memory does not follow: measured on the smoke pair
#   at 12 layers and batch_size=2, this variant peaks at 31.1 GiB against V11's
#   31.4, because the router's K-specific heads and seed bank cost roughly what
#   the extra Gaussians do. gaussian_head.initial_opacity stays at 0.2 rather
#   than being rescaled to the higher density, matching what V11.1 did when it
#   went the other way to a single Gaussian per token.
model:
  variant: dynamic_2dgs_attention_velocity_v11_3

device: [0]

exp_name: ${model.variant}-bs-${train.batch_size}

p2g:
  anchor_mode: grid
  freeze_utonia: true
  utonia_feature_stage: 3
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  # Inactive compatibility values; V11.3 validation requires LoRA above.
  agg_mlp:
    hidden_dim: 1024
    hidden_layers: 2
    out_dim: 576
  joint_refiner:
    num_heads: 12
    rope_base: 10.0
    rope_position_scale: 4.0
  # Two Gaussians per occupied token, seeded at that token's own range
  # quantiles. exp: null is the range-quantile placement rule; exp: 1 would put
  # both on the medoid and exp: 2 on the Utonia cell coordinate. K_max also
  # sets how many seed deltas condition the Gaussian head, so raising it
  # widens that head's input by three channels per added slot. This variant
  # has no count router, so count_mode=learned_gumbel is rejected rather than
  # ignored -- run V11 itself for the routed count.
  grid_query:
    count_mode: legacy
    K_max: 2
    exp: null

data:
  mode: bbox
  bbox_json_path: null

dynamic_2dgs:
  temporal:
    implementation: flash_varlen
    layers: 12
    num_heads: 12
    mlp_ratio: 4

    # V5 physical endpoint-time conditioning before layer one, as in V9/V10.
    use_time_embedding: true
    time_embedding_dim: 64
    time_frequencies: 8
    time_reference_sec: 1.0

    position_encoding: barrier_rope_split

    # Head 0's barrier. The hinge is not a bilinear form, so unlike V10's
    # -(d/R)^2 it cannot be folded into extra Q/K channels; head 0 therefore
    # runs an explicit chunked softmax while heads 1-11 stay on FlashAttention.
    # At init QK-Norm holds the content logit spread near +-1, so a=4 makes the
    # barrier decisive well before it saturates: 0 inside R, 1 logit at 1.5R,
    # 4 at 2R (matching what V10's quadratic charges at the same distance),
    # and 16 at 3R. R = 30 m at the nominal 1.0 s endpoint interval.
    barrier_speed_mps: 30.0
    barrier_weight: 4.0
    # Query rows per explicit head-0 softmax chunk. Each chunk is recomputed in
    # backward, so this trades peak N_q x N_k score memory against kernel-launch
    # and chunk-boundary overhead; it never changes the result. At the ~7.5k
    # tokens/frame a nuScenes sweep produces this is two chunks per frame and
    # ~120 MB per transient score block. Raise it when memory allows: an
    # unchunked frame measured ~8% faster.
    match_chunk_size: 4096

    # Heads 1-11 only. 2*pi/scale = 5 m for the highest-frequency 3D RoPE band.
    rope_base: 100.0
    rope_position_scale: 1.2566370614359172

    qk_norm: true
    layer_scale_init: 0.1

  gaussian_head:
    # Output priors for both slots of the seed-conditioned fixed-count head.
    initial_opacity: 0.2
    initial_scale_m: 0.3

  motion:
    # The offset head is conditioned on the initializer it corrects:
    #   e_v = Linear(3,32) -> SiLU -> Linear(32,32)
    #   v_offset = Linear(96,3)(SiLU(Linear(432+32,96)([LN(f'), e_v])))
    # head 0's attended feature channels carry no metric coordinate, so without
    # this embedding the head cannot see what it is correcting. The zero output
    # initialization still starts a fresh run at v_total = v_init.
    zero_init: true
    residual_hidden_dim: 96
    velocity_embedding_dim: 32
    # The conditioning copy is detached, so v_init + v_offset stays the only
    # route from the offset loss back into correspondence. Every init-conditioned
    # head in this repo does the same; flip it here to open the second path.
    detach_init_condition: true

  regularization:
    small_motion:
      enabled: false
      weight: 0.005
      epsilon_m: 0.001
      warmup_steps: 300
      ramp_steps: 1700

    velocity_l2:
      enabled: true
      # w_i * mean(||v_init||_2^2) + w_o * mean(||v_offset||_2^2), charged
      # independently. Penalizing the sum instead would pay the offset to point
      # backwards through the cross term -- V5's residual collapsed to a pure
      # shrink operator at cos(init, offset) = -0.997 under exactly that form.
      # Regularizing only the offset (V6/V7) removes the shrink incentive but
      # leaves v_init unbounded, and V6's background |v_init| then grew to
      # 5.8 m/s, past the vehicles it was meant to track.
      #
      # With a fixed two Gaussians per token these means are plain token means;
      # under V11's router they were K-weighted.
      mode: split_group_l2
      init_weight: 0.01
      offset_weight: 0.01
      warmup_steps: 0
      ramp_steps: 0

# Keep the requested reconstruction/scale objective explicit in this variant.
loss:
  w_chamfer: 0.02
  w_scale: 0.0
